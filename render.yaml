databases:
  - name: respiratory-ai-db
    plan: free

services:
  # Backend: FastAPI
  - type: web
    name: respiratory-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: respiratory-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.0

  # Frontend: React
  - type: web
    name: respiratory-ai-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: build
    rootDir: frontend
    routes:
      # React Router needs the SPA entry point for direct/deep-link requests.
      # Without this, refreshing /dashboard makes the static host look for
      # a physical "dashboard" file and returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://respiratory-ai-backend.onrender.com
